<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel+Decorative:wght@400;700;900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: "Poppins", sans-serif;
        }
        .container{
            width: 100%;
            height: 100vh;
            background-image: url(./image/img4.jpg);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login{
            box-shadow: 0px 0px 5px white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            flex-direction: column;
            width: 28%;
            height: 430px;  
            background: transparent;
            padding: 20px;
        }
        .login > .frm{
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-top: 28px;
            width: 90%;
        }
        .frm>input{
            width: 100%;
            padding: 10px;
            border-radius: 999px;
            border: 2px solid white;
            background: transparent;
        }
        .check{
            display: flex;
            gap: 6px;
            letter-spacing: -1px;
            cursor: pointer;
            margin-top: 30px;
            color: white;
        }
        .login .submit{
            margin-top: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            padding: 3px;
            width: 90%;
            background-color: white;
            border-radius: 999px;
            text-decoration: none;
            color: Black;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .submit:hover{
            background-color: rgb(108, 104, 104);
            color: white;
            transform: scale(1.1);
        }
        .submit:active{
            transform: translateY(0px);
            color: black;
        }
        .login p{
            margin-top: 20px;
            color: white;
            font-size: 14px;
        }
        h1{
            color: white;
        }
        .forgot{
            font-size: 12px;
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            
        }
         .forgot:hover{
            color: white;
            border-bottom: 1px solid rgb(108, 104, 104);
            transform: scale(1.1);
        }
        .forgot:active{
            transform: translateY(0px);
            color: black;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="login">
            <h1>Login</h1>
            <div class="frm">
                <!-- Here is some input's elements -->
                <input type="text" name="username" placeholder="Username">
                <input type="password" name="" placeholder="Password">
            </div>
            <div class="check">
                <!-- Here is some checkbox content -->
                <input type="checkbox" name="" id="checkboxes">
                <label for="checkboxes">Remember Me</label>
                <span>||</span>
                <a href="" class="forgot">Forgot Password</a>
                </div>
            <!-- Here we make a submit button -->
            <a href="index.html" class="submit">Submit</a>
            <p>Don't have an account? Register</p>
        </div>
    </div>
</body>
</html>
